<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description" content="Boilerplate for polaris chip">
  <base href="/">

  <style>
    :root,
    html,
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #ededed;
    }
    polaris-chip {
      margin: 16px;
    }
  </style>
  <title>polaris-chip / my-card</title>
</head>

<body>
  <h1>polaris-chip</h1>
  <!-- this is going to do whatever the tag's defaults are -->
  <polaris-chip title="News of Record" link="https://psu.edu/"></polaris-chip>
  <polaris-chip title="Faculty and Staff"></polaris-chip>
  <polaris-chip title="Sports are the only thing that matter"></polaris-chip>
  <polaris-chip title="Grants and donations"></polaris-chip>

  <h1>my-card</h1>
  <my-card
  title="Tyrese Maxey"
  image="https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/4431678.png&w=350&h=254"
  alt="Tyrese Maxey"
  description="Tyrese Maxey plays Point Guard for the 76ers."
  ></my-card>

  <my-card
  title="Joel Embiid"
  image="https://cdn.nba.com/headshots/nba/latest/1040x760/203954.png"
  alt="Joel Embiid"
  description="Joel Embiid plays Center for the 76ers."
  ></my-card>

  <my-card
  title="VJ Edgecombe"
  image="https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/5124612.png&w=350&h=254"
  alt="VJ Edgecombe"
  description="VJ Edgecombe plays Shooting Guard for the 76ers."
  ></my-card>

  <my-card
  title="Kelly Oubre"
  image="https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/3133603.png&w=350&h=254"
  alt="Kelly Oubre"
  description="Kelly Oubre plays Small Forward for the 76ers."
  ></my-card>

  <my-card
  title="Paul George"
  image="https://cdn.nba.com/headshots/nba/latest/1040x760/202331.png"
  alt="Tyrese Maxey"
  description="Paul George plays Small Forward for the 76ers."
  ></my-card>

  <!-- this is what is bringing in the definition for this tag -->
  <script type="module" src="./src/polaris-chip.js"></script>
  <script type="module" src="./src/my-card.js"></script>
</body>

</html>
